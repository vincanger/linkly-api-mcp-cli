    <path class="wire" d="M222 207.0 H262"/>
    <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.4571"/><path class="wire-ans" d="M228 152 H242 V335.0 H222"/></g>
    <circle class="pkt" r="7" opacity="0" style="fill:var(--mcp)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0214;0.1429;1"><mpath xlink:href="#m-a2s"/></animateMotion><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0214;0.1429"/></circle>
    <circle class="pkt" r="7" opacity="0" style="fill:var(--ask)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1571;0.2286;1"><mpath xlink:href="#m-s2c"/></animateMotion><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1571;0.2286"/></circle>
    <circle class="pkt" r="7" opacity="0" style="fill:var(--ask)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2429;0.3143;1"><mpath xlink:href="#m-c2y"/></animateMotion><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2429;0.3143"/></circle>
    <circle class="pkt" r="7" opacity="0" style="fill:var(--warn)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4714;0.5929;1"><mpath xlink:href="#m-p2s"/></animateMotion><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4714;0.5929"/></circle>
    <circle class="pkt" r="7" opacity="0" style="fill:var(--mcp)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6071;0.7286;1"><mpath xlink:href="#m-s2a"/></animateMotion><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6071;0.7286"/></circle>
    <g transform="translate(36,52)"><rect class="box" width="186" height="54" rx="9"/><text class="t" x="14" y="25">You</text><text class="s" x="14" y="43">the person who asked</text></g>
    <g transform="translate(36,180)"><rect class="box" width="186" height="54" rx="9"/><text class="t" x="14" y="25">Client app</text><text class="s" x="14" y="43">opens your app's page</text></g>
    <g transform="translate(262,180)"><rect class="box" width="154" height="54" rx="9"/><text class="t" x="14" y="25">Agent</text><text class="s" x="14" y="43">the model</text></g>
    <g transform="translate(36,308)"><rect class="box" width="186" height="54" rx="9"/><rect width="186" height="4" rx="2" style="fill:var(--mcp)"/><text class="t" x="14" y="25">Your MCP server</text><text class="s mono" x="14" y="43">delete_link tool</text></g>
    <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.3143"/><text class="tag" x="339.0" y="254" text-anchor="middle">never sees the question</text></g>
    <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.3143"/><g transform="translate(228,28)"><rect class="dialog" width="190" height="142" rx="9"/><text class="dq" x="16" y="30">Delete this link?</text><rect class="hl" x="11" y="40" width="62" height="19" rx="4" opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.3714"/></rect><text class="dp mono" x="16" y="53.5">/r/wasp</text><text class="dp dm" x="16" y="74">→ wasp.sh</text><text class="dp dm" x="16" y="92">Requested by Claude Code</text><rect class="btn-ghost" x="16" y="102" width="60" height="24" rx="6"/><rect class="press" x="13" y="99" width="66" height="30" rx="8" opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.4286"/></rect><text class="bt" x="46" y="118.5" text-anchor="middle">Cancel</text><rect class="btn-del" x="82" y="102" width="92" height="24" rx="6"/><text class="bt bt-on" x="128" y="118.5" text-anchor="middle">Confirm delete</text></g></g>
    <g transform="translate(274,144)"><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.3786"/><g><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1" values="44 50;44 50;0 0;0 0" keyTimes="0;0.3857;0.4214;1"/><g><animateTransform attributeName="transform" type="scale" dur="14s" repeatCount="indefinite" values="1;1;0.82;1;1" keyTimes="0;0.4243;0.4286;0.4371;1"/><path class="cursor" d="M0 0 L0 17 L4.2 13.2 L7 19.6 L9.9 18.3 L7.2 12 L12.6 12 Z"/></g></g></g></g>
    <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.4429"/><circle cx="200" cy="79.0" r="10" class="ok-bg"/><path class="ck" d="M195 79.0 l4 4 l8 -8"/></g>
    <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.5929"/><text class="tag-ok" x="254" y="333.0">/r/wasp kept</text><text class="tag" x="254" y="351.0">nothing was deleted</text></g>
    <line class="sep" x1="16" y1="382" x2="412" y2="382"/>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1571"/><circle cx="36" cy="410" r="12" style="fill:var(--mcp)"/><text x="36" y="414.5" text-anchor="middle" class="num">1</text><text class="cap" x="58" y="405">The agent calls delete_link for the old</text><text class="cap" x="58" y="425">wasp.sh link, and picks /r/wasp by mistake.</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1571;0.3286"/><circle cx="36" cy="410" r="12" style="fill:var(--ask)"/><text x="36" y="414.5" text-anchor="middle" class="num">2</text><text class="cap" x="58" y="405">Your server asks the client to open a</text><text class="cap" x="58" y="425">confirmation page. The agent isn't asked.</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3286;0.4714"/><circle cx="36" cy="410" r="12" style="fill:var(--ask)"/><text x="36" y="414.5" text-anchor="middle" class="num">3</text><text class="cap" x="58" y="405">Your page shows the link it would delete.</text><text class="cap" x="58" y="425">Wait: /r/wasp is the one on your badges.</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4714;0.6071"/><circle cx="36" cy="410" r="12" style="fill:var(--warn)"/><text x="36" y="414.5" text-anchor="middle" class="num">4</text><text class="cap" x="58" y="405">You click Cancel. The answer goes from the</text><text class="cap" x="58" y="425">page to your server, not through the client.</text></g>
    <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.6071"/><circle cx="36" cy="410" r="12" style="fill:var(--ok)"/><text x="36" y="414.5" text-anchor="middle" class="num">5</text><text class="cap" x="58" y="405">Nothing was deleted. The agent learns you</text><text class="cap" x="58" y="425">cancelled, and can find the right link.</text></g>
  </g>
</svg>
